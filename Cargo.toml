[package]
name = "lambda-budget-ledger-add"
version = "0.1.0"
edition = "2024"

[dependencies]
budget-ledger = { git = "https://github.com/iaireal/rust-lib-budget-ledger", version = "0.1.0" }
lambda_runtime = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros"] }

[dev-dependencies]
serde_json = "1.0.154"

[profile.release]
# Remove debugging symbols from the program, which makes the zip file smaller.
strip = true
